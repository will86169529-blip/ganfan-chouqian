<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

    extend: {
      colors: {
        warm: {
          50:'#fff5f0', 100:'#ffe8db', 200:'#ffd1b8', 300:'#ffb38a',
          400:'#ff9557', 500:'#ff7b2c', 600:'#e6651a', 700:'#bf4f0f',
          800:'#993d08', 900:'#732d04'

        cream: '#FFF8F0',

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap');

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(170deg, #FFF8F0 0%, #FFF0E0 30%, #FFFAF0 60%, #FFF5EC 100%);
  min-height: 100vh;
  color: #3D2C1E;
  -webkit-font-smoothing: antialiased;
}

/* 背景装饰 */
body::before {
  content: '';
  position: fixed;
  top: -180px; right: -120px;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(255,155,80,0.12) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -100px; left: -80px;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(255,200,60,0.10) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none; z-index: 0;
}

/* 结果卡片动画 */
@keyframes resultPopIn {
  0%   { transform: translateY(30px) scale(0.92); opacity: 0; }
  60%  { transform: translateY(-4px) scale(1.02); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}
.result-enter { animation: resultPopIn 0.5s cubic-bezier(0.22, 0.98, 0.36, 1.1) forwards; }

/* 文字闪烁抽签 */
@keyframes textShuffle {
  0%,100% { opacity:1; }
  50%     { opacity:0.3; transform:translateY(-2px); }
}
.shuffling .shuffle-text { animation: textShuffle 0.1s ease-in-out infinite; }

/* 按钮悬浮 */
.btn-primary {
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 14px 0 rgba(255,123,44,0.3);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px 0 rgba(255,123,44,0.4);
}
.btn-primary:active { transform: translateY(0) scale(0.97); }

/* 分类胶囊 */
.cat-chip {
  transition: all 0.2s ease;
  cursor: pointer;
  user-select: none;
}
.cat-chip:hover { transform: translateY(-1px); }
.cat-chip.active {
  background: linear-gradient(135deg, #ff7b2c, #ff9557);
  color: #fff;
  box-shadow: 0 3px 12px rgba(255,123,44,0.35);
  font-weight: 600;
}

/* 底栏 */
.bottom-nav {
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(255,255,255,0.85);
  border-top: 1px solid rgba(0,0,0,0.05);
}

/* 标签 */
.badge {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 10px; border-radius: 20px;
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em;
}
.badge-hot     { background: #FFF0F0; color: #E53E3E; }
.badge-takeout { background: #ECFDF5; color: #059669; }
.badge-trend   { background: #FFF7ED; color: #EA580C; }

/* Toast */
.toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  background: #2D2420; color: #fff;
  padding: 10px 22px; border-radius: 30px; font-size: 0.85rem;
  z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s;
  pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 不喜欢滑出 */
@keyframes dislikeOut {
  0%   { transform: translateX(0); opacity:1; }
  100% { transform: translateX(120%); opacity:0; }
}
.dislike-remove { animation: dislikeOut 0.35s ease-in forwards; }

/* 滚动条 */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #FFB38A; border-radius: 4px; }

/* 空状态插图 */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  padding: 60px 20px; color: #C9B8A8;
}
.empty-state .icon { font-size: 3.5rem; margin-bottom: 12px; opacity: 0.6; }
</style>
</head>
<body class="relative z-10">

<!-- Toast -->
<div id="toast" class="toast" style="transform:translateX(-50%) translateY(-12px)"></div>

<!-- 主容器 -->
<div class="max-w-lg mx-auto px-4 py-5 pb-28">

  <!-- ====== HEADER ====== -->

      <span id="locationText" class="text-xs text-gray-500">正在定位…</span>
    </div>
    <h1 class="text-4xl font-black tracking-tight" style="background:linear-gradient(135deg,#FF7B2C,#FFB84D);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
      今天吃啥

    <p class="text-sm text-gray-400 mt-1 font-medium">干饭抽签器 · 专治选择困难</p>
  </header>

  <!-- ====== 分类筛选 ====== -->
  <div class="flex flex-wrap gap-2 justify-center mb-4" id="categoryFilters">
  </div>

  <!-- ====== 抽签结果区（核心） ====== -->
  <div id="drawArea" class="mb-4">

    <div id="initialState" class="text-center py-10">
      <div class="text-7xl mb-5 opacity-80">🍚</div>
      <button id="mainDrawBtn" onclick="drawFood()"
        class="btn-primary px-12 py-4 text-white text-xl font-black rounded-2xl"
        style="background:linear-gradient(135deg,#FF7B2C,#FF9A4D);">
        🎲 来一签！
      </button>
      <p class="text-xs text-gray-400 mt-4">点击上方按钮，随机抽取今日美食</p>
    </div>

    <!-- 结果状态：大卡片 -->
    <div id="resultState" class="hidden">
      <div id="resultCard" class="bg-white rounded-3xl shadow-xl shadow-orange-100/50 border border-orange-50 overflow-hidden">
        <!-- 顶部装饰条 -->
        <div class="h-1.5" style="background:linear-gradient(90deg,#FF7B2C,#FFB84D,#FF7B2C);"></div>
        <div class="p-6">
          <!-- emoji + 名称 -->
          <div class="flex items-start gap-4 mb-4">
            <div class="text-5xl flex-shrink-0" id="resultEmoji">🎯</div>
            <div class="flex-1 min-w-0">
              <h2 class="text-2xl font-black text-gray-800 leading-tight" id="resultName">--</h2>
              <div class="flex items-center gap-2 mt-1 flex-wrap">
                <span class="text-xs text-gray-400" id="resultMeta">--</span>
                <span id="resultTags"></span>
              </div>
            </div>
          </div>
          <!-- 详情 -->
          <div class="rounded-2xl p-4 mb-4 text-sm text-gray-600 leading-relaxed" id="resultDetail"
               style="background:linear-gradient(135deg,#FFF8F0,#FFF3E6);">--</div>
          <!-- 操作栏 -->
          <div class="flex gap-2">
            <button id="dislikeBtn" onclick="dislikeCurrent()"
              class="flex-1 py-3 rounded-xl font-medium text-sm transition-all
                     bg-gray-50 text-gray-400 hover:bg-gray-100 hover:text-gray-600">
              👎 不喜欢
            </button>
            <button id="favBtn" onclick="favCurrent()"

              🤍 收藏
            </button>
            <button id="redrawBtn" onclick="drawFood()"

              style="background:linear-gradient(135deg,#FF7B2C,#FF9557);">
              🔄 再来一签
            </button>

                     bg-gray-50 text-gray-500 hover:bg-gray-100">
              📤
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== 附近商家 ====== -->

      <h3 class="font-bold text-gray-700 text-sm flex items-center gap-1.5">
        <span>📍</span> 附近美食

    </div>
    <div id="nearbyList" class="space-y-0.5"></div>

  </div>

  <!-- ====== 热门推荐 ====== -->

</div>

<!-- ====== 底部导航 ====== -->

function lsGet(key, fallback) { try { const v=localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } }
function lsSet(key, val)    { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

function getFavs()     { return lsGet('food_favs', []); }
function setFavs(arr)  { lsSet('food_favs', arr); }
function getHist()     { return lsGet('food_hist', []); }
function setHist(arr)  { lsSet('food_hist', arr.slice(0, 50)); }
function getDislikes() { return lsGet('food_dislikes', []); }
function setDislikes(arr) { lsSet('food_dislikes', arr); }
function getLocCache() { return lsGet('food_loc', null); }
function setLocCache(v){ lsSet('food_loc', v); }

function buildCategoryChips() {
  const cats = ['全部','中餐','小吃','日韩','西餐','东南亚','甜品','快餐','火锅','烧烤','饮品','早餐','轻食'];
  const emojis = { '全部':'🎯','中餐':'🥢','小吃':'🍢','日韩':'🍣','西餐':'🥩','东南亚':'🥘','甜品':'🍰','快餐':'🍔','火锅':'🍲','烧烤':'🍖','饮品':'🥤','早餐':'🥖','轻食':'🥗' };
  const container = document.getElementById('categoryFilters');
  container.innerHTML = cats.map(c => {
    const active = c === currentCategory;
    return `<button class="cat-chip px-4 py-2 rounded-full text-sm ${active?'active':'bg-gray-100 text-gray-500'}"
              data-cat="${c}">${emojis[c]} ${c}</button>`;
  }).join('');

  container.addEventListener('click', e => {
    const btn = e.target.closest('.cat-chip');
    if (!btn) return;
    currentCategory = btn.dataset.cat;
    container.querySelectorAll('.cat-chip').forEach(b => {
      b.className = b.dataset.cat === currentCategory
        ? 'cat-chip px-4 py-2 rounded-full text-sm active'
        : 'cat-chip px-4 py-2 rounded-full text-sm bg-gray-100 text-gray-500';
    });
    // 切换分类后自动抽一签
    drawFood();
  });
}

function initNav() {

function drawFood() {
  if (isDrawing) return;
  isDrawing = true;
  const btn = document.getElementById('mainDrawBtn');
  if (btn) { btn.textContent = '🎰 抽取中…'; btn.style.opacity = '0.6'; }

  // 构造可用池（过滤不喜欢的）
  const dislikes = getDislikes();
  let pool = FOOD_DB.filter(f => !dislikes.includes(f.id));
  if (currentCategory !== '全部') pool = pool.filter(f => f.cat === currentCategory);
  if (pool.length === 0) {
    pool = FOOD_DB.filter(f => !dislikes.includes(f.id));
    if (pool.length === 0) { showToast('所有美食都被你 pass 了，已重置屏蔽列表'); resetDislikesSilent(); pool = [...FOOD_DB]; }
  }

  const target = pool[Math.floor(Math.random() * pool.length)];

  // 快速闪烁效果（0.6秒内随机切换显示临时名称）
  const resultNameEl = document.getElementById('resultName');
  const resultEmojiEl = document.getElementById('resultEmoji');
  const resultDetailEl = document.getElementById('resultDetail');
  const resultMetaEl = document.getElementById('resultMeta');
  const resultTagsEl = document.getElementById('resultTags');

  // 先切换到结果态
  document.getElementById('initialState').classList.add('hidden');
  const resultState = document.getElementById('resultState');
  resultState.classList.remove('hidden');

  // 闪烁动画
  let shuffleCount = 0;
  const maxShuffles = 12;
  const shuffleInterval = setInterval(() => {
    const r = pool[Math.floor(Math.random() * pool.length)];
    resultNameEl.textContent = r.name;
    resultEmojiEl.textContent = r.emoji;
    shuffleCount++;
    if (shuffleCount >= maxShuffles) {
      clearInterval(shuffleInterval);
      // 显示最终结果
      showResult(target);
      isDrawing = false;
      if (btn) { btn.textContent = '🎲 来一签！'; btn.style.opacity = '1'; }
    }
  }, 60);

  // 滚动到结果卡片
  setTimeout(() => {
    resultState.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 150);
}

function showResult(item) {
  currentResult = item;
  const card = document.getElementById('resultCard');
  card.classList.remove('result-enter');
  void card.offsetWidth;
  card.classList.add('result-enter');

  document.getElementById('resultName').textContent   = item.name;
  document.getElementById('resultEmoji').textContent  = item.emoji;
  document.getElementById('resultMeta').textContent   = `${item.cat}  |  ${item.price||'价格不详'}`;
  document.getElementById('resultDetail').textContent = item.detail;

  // 标签
  let tags = '';
  if (item.delivery) tags += '<span class="badge badge-takeout">🛵 外卖</span> ';
  if (item.hot)      tags += '<span class="badge badge-hot">🔥 热门</span> ';
  document.getElementById('resultTags').innerHTML = tags;

  // 收藏按钮状态
  updateFavBtnState();

  // 显示操作按钮区
  document.getElementById('initialState').classList.add('hidden');
  document.getElementById('resultState').classList.remove('hidden');

  // 存历史
  addHist(item);
}

function updateFavBtnState() {
  const btn = document.getElementById('favBtn');
  if (!currentResult) return;
  const isFaved = getFavs().some(f => f.id === currentResult.id);
  btn.innerHTML = isFaved ? '❤️ 已收藏' : '🤍 收藏';
  if (isFaved) { btn.classList.add('text-red-500'); btn.classList.remove('text-orange-500'); }
  else         { btn.classList.remove('text-red-500'); btn.classList.add('text-orange-500'); }
}

function favCurrent() {
  if (!currentResult) return;
  let favs = getFavs();
  const idx = favs.findIndex(f => f.id === currentResult.id);
  if (idx > -1) {
    favs.splice(idx, 1);
    showToast('已取消收藏');
  } else {
    favs.unshift({ ...currentResult, time: Date.now() });
    showToast('收藏成功 ❤️');

  setFavs(favs);
  updateFavBadge();
  updateFavBtnState();
}

// =====================================================
//  定位（自动 + 缓存）
// =====================================================
let locationResolved = false;

function autoLocation() {
  const cached = getLocCache();
  const locText = document.getElementById('locationText');

  if (cached && cached.city) {
    userLocation = cached;
    locText.textContent = '📍 ' + cached.city;
    fetchNearbyByCity(cached.city);
  }

  // 并行策略：同时尝试浏览器精确定位和IP定位，谁先完成用谁
  // 同时设置8秒兜底，避免因权限弹窗无响应而卡死

  // 8秒兜底计时器
  setTimeout(() => {
    if (!locationResolved && (!cached || !cached.city)) {
      console.warn('定位8秒超时，强制降级');
      ipFallback();
    }
  }, 8000);

  // IP定位立即启动（无权限弹窗，通常2-3秒完成）
  if (!cached || !cached.city) {
    ipFallback();
  }

  // 浏览器精确定位作为增强（会弹权限，慢但精确）
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLocation.lat = pos.coords.latitude;
        userLocation.lng = pos.coords.longitude;
        fetchNearby(pos.coords.latitude, pos.coords.longitude);
      },
      (err) => {
        console.warn('浏览器定位失败:', err.code, err.message);
        // 失败不影响，IP定位已经在跑或已完成
      },
      { enableHighAccuracy: false, timeout: 6000, maximumAge: 300000 }
    );
  }
}

function refreshLocation() {
  const locText = document.getElementById('locationText');
  locText.textContent = '刷新定位…';
  locationResolved = false;
  
  // 并行策略：IP定位立即启动 + 浏览器精确定位 + 8秒兜底
  setTimeout(() => {
    if (!locationResolved) {
      console.warn('刷新定位超时，强制降级');
      ipFallback();
    }
  }, 8000);

  // IP定位立即启动
  ipFallback();

  // 浏览器精确定位作为增强
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        userLocation.lat = pos.coords.latitude;
        userLocation.lng = pos.coords.longitude;
        fetchNearby(pos.coords.latitude, pos.coords.longitude);
      },
      () => {},
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }
}

function ipFallback() {
  const locText = document.getElementById('locationText');
  locText.textContent = '正在通过IP定位…';
  
  fetch(`https://restapi.amap.com/v3/ip?key=${AMAP_KEY}`)
    .then(r => r.json())
    .then(d => {
      console.log('高德IP定位返回:', d); // 调试信息
      if (d.status === '1') {
        userLocation.city = d.city || d.province || '未知';
        setLocCache({ city: userLocation.city, lat: null, lng: null });
        locationResolved = true;
        locText.textContent = '📍 ' + userLocation.city;
        fetchNearbyByCity(userLocation.city);
      } else {
        console.warn('高德IP定位失败:', d);
        locText.textContent = '定位不可用 (API错误)';
        // 备用方案：使用公共IP定位
        fallbackToPublicAPI();
      }
    })
    .catch(err => { 
      console.error('高德IP定位网络错误:', err);
      locText.textContent = '定位不可用 (网络错误)';
      fallbackToPublicAPI();
    });
}

function fallbackToPublicAPI() {
  const locText = document.getElementById('locationText');
  locText.textContent = '正在尝试备用定位…';
  
  // 备用方案1：使用ip-api.com
  fetch('http://ip-api.com/json/?fields=status,message,city,regionName,country')
    .then(r => r.json())
    .then(data => {
      if (data.status === 'success') {
        userLocation.city = data.city || data.regionName || '未知';
        setLocCache({ city: userLocation.city, lat: null, lng: null });
        locationResolved = true;
        locText.textContent = '📍 ' + userLocation.city;
        fetchNearbyByCity(userLocation.city);
      } else {
        // 备用方案2：使用纯前端IP定位
        locText.textContent = '📍 全国';
        userLocation.city = '全国';
        setLocCache({ city: '全国', lat: null, lng: null });
      }
    })
    .catch(() => {
      // 所有方案都失败
      locText.textContent = '📍 全国 (定位失败)';
      userLocation.city = '全国';
      setLocCache({ city: '全国', lat: null, lng: null });
    });
}

function fetchNearby(lat, lng) {
  // 分4页抓取，每页25条，共100条
  const pages = [1,2,3,4].map(page => {
    const url = `https://restapi.amap.com/v3/place/around?key=${AMAP_KEY}&location=${lng},${lat}&radius=3000&types=050000&offset=25&page=${page}&extensions=all`;
    return fetch(url).then(r=>r.json());
  });
  
  Promise.all(pages).then(results => {
    let allPois = [];
    results.forEach(data => {
      if (data.status==='1' && data.pois) {
        if (!userLocation.city) userLocation.city = data.pois[0]?.cityname || '';
        allPois = allPois.concat(data.pois);
      }
    });
    if (allPois.length) {
      setLocCache({ city: userLocation.city, lat, lng });
      locationResolved = true;
      document.getElementById('locationText').textContent = '📍 ' + userLocation.city;
      renderNearby(allPois);
    }
  }).catch(() => {});
}

function fetchNearbyByCity(city) {
  const pages = [1,2,3,4].map(page => {
    const url = `https://restapi.amap.com/v3/place/text?key=${AMAP_KEY}&keywords=餐饮&city=${encodeURIComponent(city)}&offset=25&page=${page}&extensions=all`;
    return fetch(url).then(r=>r.json());
  });

  Promise.all(pages).then(results => {
    let allPois = [];
    results.forEach(data => {
      if (data.status==='1' && data.pois) allPois = allPois.concat(data.pois);
    });
    if (allPois.length) renderNearby(allPois);
  }).catch(()=>{});
}

function renderNearby(pois) {
  const section = document.getElementById('nearbySection');
  const list = document.getElementById('nearbyList');
  document.getElementById('nearbyCity').textContent = userLocation.city || '';

  if (!pois || !pois.length) { section.classList.add('hidden'); return; }
  section.classList.remove('hidden');

  list.innerHTML = pois.map(p => {
    const dist = p.distance
      ? (p.distance < 1000 ? `${p.distance}m` : `${(p.distance/1000).toFixed(1)}km`)
      : '';
    const cat = (p.type||'').split(';').filter(t => t.indexOf('餐饮')===-1)[0] || '美食';
    const catClean = cat.replace(/中餐厅|外国餐厅|快餐厅|休闲餐饮|地方风味|冷饮店|咖啡厅|茶艺馆|糕饼店/g, '').replace(/[;：:]/g,'').trim() || '美食';
    const rating = p.biz_ext?.rating || '';
    const cost   = p.biz_ext?.cost || '';
    const addr   = p.address || '';
    const photos = (p.photos||[]).slice(0,1);
    const photoUrl = photos.length ? `https://${photos[0].url.replace('http://','').replace('https://','')}` : '';
    const tag = p.tag || '';

    // 模拟推荐菜品（基于品类）
    const cuisineMap = {
      '火锅': '毛肚·鹅肠·肥牛', '烧烤': '羊肉串·烤生蚝·鸡翅',
      '川菜': '水煮鱼·回锅肉·宫保鸡丁', '粤菜': '白切鸡·煲仔饭·虾饺',
      '湘菜': '剁椒鱼头·小炒肉', '日料': '三文鱼·寿司·天妇罗',
      '韩餐': '烤肉·石锅拌饭·炸鸡', '西餐': '牛排·意面·披萨',
      '小吃': '臭豆腐·煎饼·烤冷面', '面馆': '牛肉面·炸酱面·刀削面',
      '快餐': '汉堡·薯条·炸鸡', '甜品': '蛋糕·冰淇淋·双皮奶',
      '饮品': '珍珠奶茶·水果茶·咖啡', '海鲜': '大闸蟹·小龙虾·扇贝',
      '东北菜': '锅包肉·地三鲜·猪肉炖粉条',
      '西北菜': '羊肉泡馍·大盘鸡·烤羊腿',
    };
    let recommend = tag || '';
    for (const [k,v] of Object.entries(cuisineMap)) {
      if (catClean.includes(k) || (p.name||'').includes(k)) { recommend = v; break; }
    }
    if (!recommend) recommend = '招牌菜·人气单品';

    return `
      <div class="flex items-start gap-3 py-3 border-b border-gray-50 last:border-0">
        ${photoUrl ? `<img src="${photoUrl}" class="w-16 h-16 rounded-lg object-cover flex-shrink-0" onerror="this.style.display='none'">` : ''}
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-sm text-gray-800 truncate">${p.name}</span>
            ${rating ? `<span class="text-xs font-bold text-warm-500 bg-warm-50 px-1.5 py-0.5 rounded">${rating}</span>` : ''}
          </div>
          <div class="flex items-center gap-1.5 mt-1 text-xs text-gray-400">
            <span class="bg-gray-100 px-1.5 py-0.5 rounded">${catClean}</span>
            ${dist ? `<span>${dist}</span>` : ''}
            ${cost ? `<span>·</span><span>人均${cost}</span>` : ''}
          </div>
          <div class="text-xs text-gray-500 mt-1 truncate">
            <span class="text-orange-400">推荐：</span>${recommend}
          </div>
          ${addr ? `<div class="text-[11px] text-gray-300 mt-0.5 truncate">${addr}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

// =====================================================
//  Toast
// =====================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
